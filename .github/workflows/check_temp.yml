name: Surftown Wassertemperatur

on:
  schedule:
    # Startet um UTC 05:26, 11:26, 17:26, 23:26 (München Winterzeit: 06:26, 12:26, 18:26, 00:26)
    - cron: '26 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Wasser- und Wetterdaten abrufen
        run: |
          # 1. Wassertemperatur Surftown (|| true verhindert Absturz bei Timeout)
          SURF_URL="https://surftown.de/de/opening-infos.json"
          RESPONSE=$(curl -s -m 15 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" -H "Accept: application/json" -H "Referer: https://surftown.de/" "$SURF_URL" || true)
          
          if [ -z "$RESPONSE" ] || ! echo "$RESPONSE" | jq . >/dev/null 2>&1; then
            echo "Warnung: Surftown API hat einen Timeout (Code 28) oder blockiert."
            temp_clean="Timeout"
          else
            temp_raw=$(echo "$RESPONSE" | jq -r '.waterTemperature')
            temp_clean=$(echo "$temp_raw" | sed 's/° C//g' | xargs)
          fi

          # 2. Wetter Flughafen München (Open-Meteo API)
          WEATHER_URL="https://api.open-meteo.com/v1/forecast?latitude=48.3538&longitude=11.7861&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m"
          w_json=$(curl -s -m 15 "$WEATHER_URL" || true)
          
          if [ -z "$w_json" ]; then
            w_temp="-"; w_hum="-"; w_wind="-"; w_dir="-"; w_cond="Timeout"
          else
            w_temp=$(echo "$w_json" | jq -r '.current.temperature_2m')
            w_hum=$(echo "$w_json" | jq -r '.current.relative_humidity_2m')
            w_wind=$(echo "$w_json" | jq -r '.current.wind_speed_10m')
            w_code=$(echo "$w_json" | jq -r '.current.weather_code')
            w_dir_deg=$(echo "$w_json" | jq -r '.current.wind_direction_10m | round')
            
            case $w_code in
              0) w_cond="Sonnig/Klar" ;;
              1|2|3) w_cond="Bewölkt" ;;
              45|48) w_cond="Nebel" ;;
              51|53|55|56|57|61|63|65|66|67|80|81|82) w_cond="Regen" ;;
              71|73|75|77|85|86) w_cond="Schnee" ;;
              95|96|99) w_cond="Gewitter" ;;
              *) w_cond="Unbekannt" ;;
            esac

            val=$(( (w_dir_deg + 22) / 45 ))
            case $val in
              0|8) w_dir="N" ;;
              1) w_dir="NO" ;;
              2) w_dir="O" ;;
              3) w_dir="SO" ;;
              4) w_dir="S" ;;
              5) w_dir="SW" ;;
              6) w_dir="W" ;;
              7) w_dir="NW" ;;
            esac
          fi

          # 3. CSV-Formatierung und Speicherung
          zeitstempel=$(date +'%d.%m.%Y %H:%M:%S')
          FILE="wassertemperatur.csv"
          
          if [ ! -f "$FILE" ]; then
            echo "Datum Uhrzeit; Wassertemperatur °C; Lufttemperatur °C; Luftfeuchte %; Windstärke km/h; Windrichtung; WMO-Wettercode" > "$FILE"
          fi
          
          echo "$zeitstempel; $temp_clean; $w_temp; $w_hum; $w_wind; $w_dir; $w_cond" >> "$FILE"

      - name: Ergebnis ins Repository committen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wassertemperatur.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Wetter und Wasser (CSV)"
          git push
