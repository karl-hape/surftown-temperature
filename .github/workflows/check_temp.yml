name: Surftown Wassertemperatur

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Temperatur via API abrufen und speichern
        run: |
          API_URL="https://surftown.de/de/opening-infos.json"
          
          # curl als Chrome Browser tarnen und Referer mitsenden, um Bot-Schutz zu umgehen
          RESPONSE=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -H "Accept: application/json" -H "Referer: https://surftown.de/" -H "Accept-Language: de-DE,de;q=0.9,en-US;q=0.8,en;q=0.7" "$API_URL")
          
          # Prüfen, ob die Antwort gültiges JSON ist
          if ! echo "$RESPONSE" | jq . >/dev/null 2>&1; then
            echo "Fehler: Die API hat kein gültiges JSON zurückgegeben. Hier ist die rohe Antwort des Servers:"
            echo "$RESPONSE"
            exit 1
          fi
          
          # Wert extrahieren und bereinigen
          temp_raw=$(echo "$RESPONSE" | jq -r '.waterTemperature')
          temp_clean=$(echo "$temp_raw" | sed 's/° C//g' | xargs)
          
          # Zeitstempel generieren und in Textdatei schreiben
          zeitstempel=$(date +'%Y-%m-%d %H:%M:%S')
          echo "$zeitstempel - $temp_clean" >> wassertemperatur.txt

      - name: Ergebnis ins Repository committen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wassertemperatur.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Wassertemperatur"
          git push
