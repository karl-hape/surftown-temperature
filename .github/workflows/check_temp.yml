name: Surftown Wassertemperatur

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Wasser- und Wetterdaten abrufen
        run: |
          # 1. Wassertemperatur Surftown
          SURF_URL="https://surftown.de/de/opening-infos.json"
          RESPONSE=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" -H "Accept: application/json" -H "Referer: https://surftown.de/" "$SURF_URL")
          
          if ! echo "$RESPONSE" | jq . >/dev/null 2>&1; then exit 1; fi
          
          temp_raw=$(echo "$RESPONSE" | jq -r '.waterTemperature')
          temp_clean=$(echo "$temp_raw" | sed 's/° C//g' | xargs)

          # 2. Wetter Flughafen München (Open-Meteo API)
          # Koordinaten MUC: Lat 48.3538, Lon 11.7861
          WEATHER_URL="https://api.open-meteo.com/v1/forecast?latitude=48.3538&longitude=11.7861&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m"
          w_json=$(curl -s "$WEATHER_URL")
          
          w_temp=$(echo "$w_json" | jq -r '.current.temperature_2m')
          w_hum=$(echo "$w_json" | jq -r '.current.relative_humidity_2m')
          w_wind=$(echo "$w_json" | jq -r '.current.wind_speed_10m')
          w_code=$(echo "$w_json" | jq -r '.current.weather_code')
          
          # Windrichtung runden für die Umrechnung
          w_dir_deg=$(echo "$w_json" | jq -r '.current.wind_direction_10m | round')
          
          # WMO-Wettercode in deutschen Text umwandeln
          case $w_code in
            0) w_cond="Sonnig/Klar" ;;
            1|2|3) w_cond="Bewölkt" ;;
            45|48) w_cond="Nebel" ;;
            51|53|55|56|57|61|63|65|66|67|80|81|82) w_cond="Regen" ;;
            71|73|75|77|85|86) w_cond="Schnee" ;;
            95|96|99) w_cond="Gewitter" ;;
            *) w_cond="Unbekannt" ;;
          esac

          # Windrichtung von Grad (0-360) in Himmelsrichtung umwandeln
          val=$(( (w_dir_deg + 22) / 45 ))
          case $val in
            0|8) w_dir="N" ;;
            1) w_dir="NO" ;;
            2) w_dir="O" ;;
            3) w_dir="SO" ;;
            4) w_dir="S" ;;
            5) w_dir="SW" ;;
            6) w_dir="W" ;;
            7) w_dir="NW" ;;
          esac

          # 3. Zusammenbauen und in Textdatei schreiben
          zeitstempel=$(date +'%Y-%m-%d %H:%M:%S')
          
          # Format: 2026-11-16 13:13:39 | Wasser: 9 | MUC: 12.5°C, 85%, Wind: 14km/h (SW), Bewölkt
          echo "$zeitstempel | Wasser: $temp_clean | MUC: ${w_temp}°C, ${w_hum}%, Wind: ${w_wind}km/h ($w_dir), $w_cond" >> wassertemperatur.txt

      - name: Ergebnis ins Repository committen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wassertemperatur.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Wetter und Wasser"
          git push
