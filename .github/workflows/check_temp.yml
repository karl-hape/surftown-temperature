name: Surftown Wassertemperatur

on:
  schedule:
    # Läuft alle 6 Stunden (UTC-Zeit)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Erlaubt den manuellen Start über die Weboberfläche

permissions:
  contents: write # Notwendig, damit der Bot die Textdatei ins Repo pushen darf

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Temperatur via API abrufen und speichern
        run: |
          # Die direkte JSON-URL von Surftown
          API_URL="https://surftown.de/de/opening-infos.json"
          
          # JSON mit curl abrufen und den Wert für waterTemperature mit jq extrahieren
          temp_raw=$(curl -s "$API_URL" | jq -r '.waterTemperature')
          
          # Das "° C" sowie evtl. Leerzeichen entfernen
          temp_clean=$(echo "$temp_raw" | sed 's/° C//g' | xargs)
          
          # Zeitstempel generieren und in die Textdatei schreiben
          zeitstempel=$(date +'%Y-%m-%d %H:%M:%S')
          echo "$zeitstempel - $temp_clean" >> wassertemperatur.txt

      - name: Ergebnis ins Repository committen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wassertemperatur.txt
          # Verhindert einen Fehler, falls sich die Datei aus irgendeinem Grund nicht geändert hat
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Wassertemperatur"
          git push
